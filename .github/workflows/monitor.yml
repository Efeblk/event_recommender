name: Monitor catalog readiness
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options: [staging, production]
        default: production
permissions:
  contents: read
jobs:
  environments:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          SCHEDULED_ENVIRONMENTS: ${{ vars.SCHEDULED_COLLECTION_ENVIRONMENTS || '["production"]' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            matrix="$SCHEDULED_ENVIRONMENTS"
          else
            matrix=$(jq -cn --arg value "$REQUESTED_ENVIRONMENT" '[ $value ]')
          fi
          if ! jq -e 'type == "array" and length > 0 and all(. == "staging" or . == "production") and (unique | length) == length' <<<"$matrix" >/dev/null; then
            echo "Monitor environments must be a unique JSON array containing only staging and production." >&2
            exit 1
          fi
          echo "matrix=$(jq -c . <<<"$matrix")" >> "$GITHUB_OUTPUT"
  ready:
    needs: environments
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.environments.outputs.matrix) }}
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BIPLAN_URL: ${{ vars.BIPLAN_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - name: Check catalog readiness
        working-directory: collector
        env:
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          npm run --silent monitor -- --environment "$TARGET_ENVIRONMENT" --output output/readiness-monitor.json
      - name: Save readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-${{ matrix.environment }}-${{ github.run_id }}
          path: collector/output/readiness-monitor.json
          if-no-files-found: warn
          retention-days: 14
