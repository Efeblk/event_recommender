name: Bi Plan
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  collector:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci --prefix collector
      - run: npm test --prefix collector
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:deploy-config
      - run: npm run test:deploy:gcp
      - name: Check frozen conversational release constraints without API calls
        run: node --experimental-strip-types scripts/check-release-cases.mjs
      - name: Check structured input fixture and API contract without API calls
        run: npm run test:input-intent
      - name: Replay Jev scores and check every recommendation without API calls
        run: node --experimental-strip-types scripts/evaluate-jev.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:node
      - name: Verify compiled Node server without API keys
        run: npm run test:smoke:node
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile browser flows without API calls
        env:
          BIPLAN_BROWSER_START: '1'
        run: npx playwright test

  gcp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:deploy:gcp
      - run: npm run build:node
      - run: npm run test:smoke:node
      - name: Build the Linux container without credentials or deployment
        run: docker build -f web/Dockerfile --tag biplan-gcp-ci:${{ github.sha }} .
        working-directory: .
      - name: Smoke the actual Linux image with networking disabled
        run: node scripts/smoke-container.mjs biplan-gcp-ci:${{ github.sha }}

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/gcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Verify private staging plans without Google credentials
        run: terraform test
