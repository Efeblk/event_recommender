name: Bi Plan
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  collector:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci --prefix collector
      - run: npm test --prefix collector
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:deploy-config
      - run: npm run test:deploy:gcp
      - name: Check frozen conversational release constraints without API calls
        run: node --experimental-strip-types scripts/check-release-cases.mjs
      - name: Replay Jev scores and check every recommendation without API calls
        run: node --experimental-strip-types scripts/evaluate-jev.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Verify built Worker and local D1 without API keys
        run: npm run test:smoke
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile browser flows without API calls
        env:
          BIPLAN_BROWSER_START: '1'
        run: npx playwright test
      - name: Verify standalone Cloudflare staging build without deploying
        env:
          DEPLOY_TARGET: staging
          CLOUDFLARE_ACCOUNT_ID: '0123456789abcdef0123456789abcdef'
          CF_WORKER_NAME: biplan-staging-ci
          CF_D1_DATABASE_NAME: biplan-staging-ci
          CF_D1_DATABASE_ID: '00000000-0000-4000-8000-000000000001'
          CF_R2_BUCKET_NAME: biplan-staging-ci-state
          CF_PUBLIC_URL: https://biplan-staging-ci.example.workers.dev
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
        run: |
          npm run deploy:config -- --env staging --validate-only
          npm run build
          npm run test:smoke
          npm run deploy:dry-run -- --env staging

  gcp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:deploy:gcp
      - run: npm run build:node
      - run: npm run test:smoke:node
      - name: Build the Linux container without credentials or deployment
        run: docker build --tag biplan-gcp-ci:${{ github.sha }} .
      - name: Smoke the actual Linux image with networking disabled
        run: node scripts/smoke-container.mjs biplan-gcp-ci:${{ github.sha }}

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/gcp
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Verify private staging plans without Google credentials
        run: terraform test
