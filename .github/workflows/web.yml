name: Bi Plan
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  collector:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci --prefix collector
      - run: npm test --prefix collector
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:deploy-config
      - run: npm run test:deploy:gcp
      - run: npm run test:deploy:postgres-plan
      - name: Check frozen conversational release constraints without API calls
        run: node --experimental-strip-types scripts/check-release-cases.mjs
      - name: Check structured input fixture and API contract without API calls
        run: npm run test:input-intent
      - name: Replay Jev scores and check every recommendation without API calls
        run: node --experimental-strip-types scripts/evaluate-jev.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Verify built Worker and local D1 without API keys
        run: npm run test:smoke
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile browser flows without API calls
        env:
          BIPLAN_BROWSER_START: '1'
        run: npx playwright test
      - name: Verify standalone Cloudflare staging build without deploying
        env:
          DEPLOY_TARGET: staging
          CLOUDFLARE_ACCOUNT_ID: '0123456789abcdef0123456789abcdef'
          CF_WORKER_NAME: biplan-staging-ci
          CF_D1_DATABASE_NAME: biplan-staging-ci
          CF_D1_DATABASE_ID: '00000000-0000-4000-8000-000000000001'
          CF_R2_BUCKET_NAME: biplan-staging-ci-state
          CF_PUBLIC_URL: https://biplan-staging-ci.example.workers.dev
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
        run: |
          npm run deploy:config -- --env staging --validate-only
          npm run build
          npm run test:smoke
          npm run deploy:dry-run -- --env staging

  gcp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:deploy:gcp
      - run: npm run build:node
      - run: npm run test:smoke:node
      - name: Build the Linux container without credentials or deployment
        run: docker build --tag biplan-gcp-ci:${{ github.sha }} .
      - name: Smoke the actual Linux image with networking disabled
        run: node scripts/smoke-container.mjs biplan-gcp-ci:${{ github.sha }}
      - name: Build bounded preparation Job without credentials
        run: docker build -f web/deploy/Dockerfile.preparation --tag biplan-preparation-ci:${{ github.sha }} .
        working-directory: .
      - name: Verify preparation image cannot default to mutation
        shell: bash
        run: |
          set +e
          docker run --rm --network none biplan-preparation-ci:${{ github.sha }}
          result=$?
          set -e
          test "$result" -eq 2

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/gcp
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Verify private staging plans without Google credentials
        run: terraform test

  postgres-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install shared collector validation dependencies without fetching providers
        run: npm ci --prefix ../collector
      - name: Start isolated PostgreSQL with PostGIS and pgvector
        run: npm run catalog:start
      - name: Verify canonical identity and mandatory evidence contracts
        run: npm run catalog:verify:canonical
      - name: Verify sealed batches and a single publication switch
        run: npm run catalog:verify:batch
      - name: Verify storage, provenance, interruption and publication guards
        run: npm run catalog:verify:batch-guards
      - name: Verify URL evidence, source expiry and empty-page publication guards
        run: npm run catalog:verify:page-receipts
      - name: Verify resumable page and multi-session source ingestion
        run: npm run catalog:verify:page-source
      - name: Verify actual restricted database roles
        run: npm run catalog:verify:roles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-contract-evidence
          path: |
            web/work/catalog-foundation/*verification*.json
            web/work/catalog-foundation/local-receipt.json
          retention-days: 14
