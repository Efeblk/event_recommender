name: Collect event data
on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options: [staging, production]
        default: production
permissions:
  contents: read
jobs:
  environments:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          SCHEDULED_ENVIRONMENTS: ${{ vars.SCHEDULED_COLLECTION_ENVIRONMENTS || '["production"]' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            matrix="$SCHEDULED_ENVIRONMENTS"
          else
            matrix=$(jq -cn --arg value "$REQUESTED_ENVIRONMENT" '[ $value ]')
          fi
          if ! jq -e 'type == "array" and length > 0 and all(. == "staging" or . == "production") and (unique | length) == length' <<<"$matrix" >/dev/null; then
            echo "Collection environments must be a unique JSON array containing only staging and production." >&2
            exit 1
          fi
          echo "matrix=$(jq -c . <<<"$matrix")" >> "$GITHUB_OUTPUT"
  collect:
    needs: environments
    concurrency:
      group: event-collection-${{ matrix.environment }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.environments.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ matrix.environment }}
    env:
      BIPLAN_URL: ${{ vars.BIPLAN_URL }}
      INDEX_EMBEDDINGS: ${{ vars.INDEX_EMBEDDINGS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record collector checkout revision
        shell: bash
        run: echo "COLLECTOR_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci --prefix collector
      - run: npm test --prefix collector
      - name: Validate destination configuration
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if { [ -n "$BIPLAN_URL" ] && [ -z "$SYNC_TOKEN" ]; } || { [ -z "$BIPLAN_URL" ] && [ -n "$SYNC_TOKEN" ]; }; then
            echo "BIPLAN_URL and SYNC_TOKEN must be configured together." >&2
            exit 1
          fi
      - name: Restore durable checkpoint
        if: env.BIPLAN_URL != ''
        working-directory: collector
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SITES_ACCESS_TOKEN: ${{ secrets.SITES_ACCESS_TOKEN }}
        run: npm run checkpoint:restore -- --output state/events.json --fallback ../web/data/events.json
      - name: Bootstrap artifact-only collection
        if: env.BIPLAN_URL == ''
        run: |
          mkdir -p collector/state
          cp web/data/events.json collector/state/events.json
          echo "Destination is not configured; this run produces artifacts only." >> "$GITHUB_STEP_SUMMARY"
      - name: Collect public listings including later pages
        run: npm run collect --prefix collector -- --limit 100 --discovery-pages 20 --snapshot state/events.json
      - name: Import, checkpoint, and read back canonical state
        if: env.BIPLAN_URL != ''
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SITES_ACCESS_TOKEN: ${{ secrets.SITES_ACCESS_TOKEN }}
        run: npm run publish --prefix collector -- --checkpoint --snapshot state/events.json --receipt output/publication.json
      - name: Index Voyage embeddings
        if: env.BIPLAN_URL != '' && env.INDEX_EMBEDDINGS == 'true'
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: node web/scripts/index-embeddings.mjs --live --max-batches 20 --interval-ms 60000
      - name: Record published run evidence
        if: success() && env.BIPLAN_URL != ''
        working-directory: collector
        run: npm run soak:report -- --publication output/publication.json
      - name: Record artifact-only run evidence
        if: success() && env.BIPLAN_URL == ''
        working-directory: collector
        env:
          COLLECTION_ENVIRONMENT: ${{ matrix.environment }}
        run: npm run soak:report
      - name: Save normalized data, source health, and run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-data-${{ matrix.environment }}-${{ github.run_id }}
          path: |
            collector/output/events.json
            collector/output/report.json
            collector/output/soak-evidence.json
            collector/output/publication.json
            collector/state/events.json
          if-no-files-found: warn
          retention-days: 14
