name: Collect event data
on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options: [staging, production]
        default: production
permissions:
  contents: read
concurrency:
  group: event-collection-${{ inputs.environment || 'production' }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment || 'production' }}
    env:
      BIPLAN_URL: ${{ vars.BIPLAN_URL }}
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      SITES_ACCESS_TOKEN: ${{ secrets.SITES_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci --prefix collector
      - run: npm test --prefix collector
      - name: Validate destination configuration
        run: |
          if { [ -n "$BIPLAN_URL" ] && [ -z "$SYNC_TOKEN" ]; } || { [ -z "$BIPLAN_URL" ] && [ -n "$SYNC_TOKEN" ]; }; then
            echo "BIPLAN_URL and SYNC_TOKEN must be configured together." >&2
            exit 1
          fi
      - name: Restore durable checkpoint
        if: env.BIPLAN_URL != '' && env.SYNC_TOKEN != ''
        working-directory: collector
        run: npm run checkpoint:restore -- --output state/events.json --fallback ../web/data/events.json
      - name: Bootstrap artifact-only collection
        if: env.BIPLAN_URL == '' && env.SYNC_TOKEN == ''
        run: |
          mkdir -p collector/state
          cp web/data/events.json collector/state/events.json
          echo "Destination is not configured; this run produces artifacts only." >> "$GITHUB_STEP_SUMMARY"
      - name: Collect public listings including later pages
        run: npm run collect --prefix collector -- --limit 100 --discovery-pages 20 --snapshot state/events.json
      - name: Import, checkpoint, and read back canonical state
        if: env.BIPLAN_URL != '' && env.SYNC_TOKEN != ''
        run: npm run publish --prefix collector -- --checkpoint --snapshot state/events.json
      - name: Record run evidence
        if: success()
        working-directory: collector
        run: npm run soak:report
      - name: Save normalized data, source health, and run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-data-${{ inputs.environment || 'production' }}-${{ github.run_id }}
          path: |
            collector/output/events.json
            collector/output/report.json
            collector/output/soak-evidence.json
            collector/state/events.json
          if-no-files-found: warn
          retention-days: 14
