name: Collect event data
on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: event-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BIPLAN_URL: ${{ vars.BIPLAN_URL }}
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      SITES_ACCESS_TOKEN: ${{ secrets.SITES_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci --prefix collector
      - run: npm test --prefix collector
      - name: Restore the last successful collection snapshot
        uses: actions/cache/restore@v4
        with:
          path: collector/state/events.json
          key: event-snapshot-${{ github.run_id }}
          restore-keys: event-snapshot-
      - name: Initialize the first snapshot
        run: |
          mkdir -p collector/state
          if [ ! -f collector/state/events.json ]; then
            cp web/data/events.json collector/state/events.json
          fi
      - name: Collect public listings including later pages
        id: collect
        run: npm run collect --prefix collector -- --limit 100 --discovery-pages 20 --snapshot state/events.json
      - name: Save the successful snapshot for the next run
        if: success()
        uses: actions/cache/save@v4
        with:
          path: collector/state/events.json
          key: event-snapshot-${{ github.run_id }}
      - name: Import verified pages when a destination is configured
        if: env.BIPLAN_URL != '' && env.SYNC_TOKEN != ''
        run: npm run publish --prefix collector
      - name: Save normalized data and source health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-data-${{ github.run_id }}
          path: |
            collector/output/events.json
            collector/output/report.json
          if-no-files-found: warn
          retention-days: 14
