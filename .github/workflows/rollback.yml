name: Roll back web Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [staging, production]
      version_id:
        description: Previously verified Cloudflare Worker version ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: ${{ inputs.environment }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      CF_PUBLIC_URL: ${{ vars.CF_PUBLIC_URL }}
      VERSION_ID: ${{ inputs.version_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Validate rollback inputs
        run: |
          [[ "$DEPLOY_TARGET" == staging || "$DEPLOY_TARGET" == production ]]
          test -n "$CLOUDFLARE_API_TOKEN"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]
          worker_name="${CF_WORKER_NAME,,}"
          [[ "$worker_name" == *"$DEPLOY_TARGET"* ]]
          if [[ "$DEPLOY_TARGET" == staging ]]; then other_environment=production; else other_environment=staging; fi
          [[ "$worker_name" != *"$other_environment"* ]]
          [[ "$VERSION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          [[ "$CF_PUBLIC_URL" =~ ^https://[^/]+/?$ ]]
          public_host="${CF_PUBLIC_URL#https://}"
          public_host="${public_host%/}"
          if [[ "$public_host" == *.workers.dev ]]; then [[ "$public_host" == "$worker_name".* ]]; fi
      - name: Roll back Worker code
        working-directory: web
        run: npx wrangler rollback "$VERSION_ID" --name "$CF_WORKER_NAME" --message "${{ inputs.environment }} manual rollback" --yes
      - name: Check liveness
        run: |
          for attempt in {1..24}; do
            echo "Checking rollback liveness (attempt $attempt/24)."
            if curl --silent --show-error --fail --max-time 15 --output health.json "$CF_PUBLIC_URL/api/health" && \
              node -e "const fs=require('fs'); const body=JSON.parse(fs.readFileSync('health.json')); if(body.status!=='ok'||body.deployment?.environment!==process.env.DEPLOY_TARGET) process.exit(1)"; then
              exit 0
            fi
            sleep 5
          done
          echo "Rollback liveness did not identify the selected environment." >&2
          exit 1
