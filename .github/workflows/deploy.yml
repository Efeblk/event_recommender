name: Deploy web Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to deploy
        required: true
        type: choice
        options: [staging, production]
      commit_sha:
        description: Full 40-character commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read

env:
  DEPLOYMENT_SHA: ${{ inputs.commit_sha }}

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      DEPLOY_TARGET: ${{ inputs.environment }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      CF_R2_BUCKET_NAME: ${{ vars.CF_R2_BUCKET_NAME }}
      CF_PUBLIC_URL: ${{ vars.CF_PUBLIC_URL }}
      TYPESAFE_MODEL: ${{ vars.TYPESAFE_MODEL }}
      VOYAGE_MODEL: ${{ vars.VOYAGE_MODEL }}
      VOYAGE_DIMENSIONS: ${{ vars.VOYAGE_DIMENSIONS }}
      AI_DAILY_LIMIT: ${{ vars.AI_DAILY_LIMIT }}
      WORKERS_PLAN: ${{ vars.WORKERS_PLAN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Verify exact revision
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            collector/package-lock.json
      - name: Install exact locked dependencies
        run: |
          npm ci
          npm ci --prefix ../collector
      - name: Validate exact-SHA source and configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          npm run deploy:config -- --env "$DEPLOY_TARGET" --validate-only --require-secrets
          npm run test:deploy-config
          npm test
          npm run typecheck
          npm run lint
          npm test --prefix ../collector
      - name: Build and verify Worker
        run: |
          npm run build
          npm run test:smoke
          npm run deploy:dry-run -- --env "$DEPLOY_TARGET"
      - name: Record build provenance
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          mkdir -p deploy-provenance
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > deploy-provenance/SHA256SUMS
          node -e "require('fs').writeFileSync('deploy-provenance/provenance.json', JSON.stringify({commit:process.env.REQUESTED_SHA, environment:process.env.DEPLOY_TARGET, node:process.version, generatedAt:new Date().toISOString()}, null, 2)+'\n')"
      - name: Upload reviewable Worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-worker-${{ inputs.environment }}-${{ inputs.commit_sha }}
          path: |
            web/dist
            web/deploy-provenance
          if-no-files-found: error
          retention-days: 30
      - name: Apply migrations, deploy, check liveness, and report readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: npm run deploy:run -- --env "$DEPLOY_TARGET"
