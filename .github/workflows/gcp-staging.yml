name: Deploy GCP staging
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit SHA to prepare and deploy
        required: true
        type: string
      input_interpreter:
        description: Request interpreter (span-v2 needs the TypeSafe key; rules needs no provider)
        required: true
        type: choice
        default: span-v2
        options:
          - rules
          - jev-v1
          - span-v2
permissions:
  contents: read
concurrency:
  group: gcp-staging-deploy
  cancel-in-progress: false
jobs:
  prepare:
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Verify exact revision
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Require green core CI on exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100" > exact-sha-checks.json
          node scripts/deploy-gates.mjs checks exact-sha-checks.json
          node -e "const fs=require('node:fs');const runs=JSON.parse(fs.readFileSync('exact-sha-checks.json')).check_runs??[];for(const name of ['gcp','terraform']){const latest=runs.filter(x=>x.name===name&&x.app?.slug==='github-actions').sort((a,b)=>(Date.parse(b.started_at)||0)-(Date.parse(a.started_at)||0)||(BigInt(b.id??0)>BigInt(a.id??0)?1:BigInt(b.id??0)<BigInt(a.id??0)?-1:0))[0];if(latest?.status!=='completed'||latest?.conclusion!=='success')throw new Error('Missing latest successful exact-SHA check: '+name)}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            collector/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix ../collector
      - name: Run offline release checks
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm test --prefix ../collector
          npm run test:deploy-config
          npm run test:deploy:gcp
          npm run test:input-intent
          node --experimental-strip-types scripts/check-release-cases.mjs
          node --experimental-strip-types scripts/evaluate-jev.ts
      - name: Build and smoke Node server
        run: |
          npm run build:node
          npm run test:smoke:node
      - name: Build immutable Linux image
        env:
          LOCAL_IMAGE: biplan-gcp-candidate:${{ inputs.expected_sha }}
        run: docker build --pull --platform linux/amd64 -f Dockerfile --tag "$LOCAL_IMAGE" ..
      - name: Smoke exact isolated container
        env:
          LOCAL_IMAGE: biplan-gcp-candidate:${{ inputs.expected_sha }}
        run: node scripts/smoke-container.mjs "$LOCAL_IMAGE"
      - name: Package image and provenance
        env:
          LOCAL_IMAGE: biplan-gcp-candidate:${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          rm -rf gcp-candidate
          mkdir gcp-candidate
          docker save "$LOCAL_IMAGE" | gzip -n > gcp-candidate/image.tar.gz
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          WEB_LOCK="$(sha256sum package-lock.json | cut -d' ' -f1)"
          COLLECTOR_LOCK="$(sha256sum ../collector/package-lock.json | cut -d' ' -f1)"
          IMAGE_ID="$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')"
          NPM_VERSION="$(npm --version)"
          SOURCE_TREE="$SOURCE_TREE" WEB_LOCK="$WEB_LOCK" COLLECTOR_LOCK="$COLLECTOR_LOCK" IMAGE_ID="$IMAGE_ID" NPM_VERSION="$NPM_VERSION" node -e "const fs=require('node:fs');const p={schemaVersion:1,revision:process.env.EXPECTED_SHA,sourceTree:process.env.SOURCE_TREE,imageId:process.env.IMAGE_ID,platform:'linux/amd64',node:process.version,npm:process.env.NPM_VERSION,lockfiles:{web:process.env.WEB_LOCK,collector:process.env.COLLECTOR_LOCK},workflowRunId:process.env.GITHUB_RUN_ID,workflowRunAttempt:process.env.GITHUB_RUN_ATTEMPT};fs.writeFileSync('gcp-candidate/provenance.json',JSON.stringify(p,null,2)+'\n')"
          (cd gcp-candidate && sha256sum image.tar.gz > image.sha256 && sha256sum image.sha256 provenance.json > manifest.sha256)
      - name: Upload immutable candidate for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gcp-staging-image-${{ inputs.expected_sha }}
          path: web/gcp-candidate
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Download candidate for round-trip verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gcp-staging-image-${{ inputs.expected_sha }}
          path: web/gcp-roundtrip
      - name: Verify stored candidate
        run: |
          set -euo pipefail
          cd gcp-roundtrip
          sha256sum --check manifest.sha256
          sha256sum --check image.sha256
          node -e "const p=require('./provenance.json');if(p.revision!==process.env.EXPECTED_SHA||p.platform!=='linux/amd64')process.exit(1)"
  deploy:
    needs: prepare
    if: needs.prepare.result == 'success'
    permissions:
      contents: read
      id-token: write
    environment: gcp-staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      INPUT_INTERPRETER: ${{ inputs.input_interpreter || 'span-v2' }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      GCP_ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      GCP_COLLECTION_BUCKET: ${{ vars.GCP_COLLECTION_BUCKET }}
      GCP_FIRESTORE_DATABASE: ${{ vars.GCP_FIRESTORE_DATABASE || '(default)' }}
      GCP_SYNC_TOKEN_SECRET: ${{ vars.GCP_SYNC_TOKEN_SECRET }}
      GCP_SYNC_TOKEN_SECRET_VERSION: ${{ vars.GCP_SYNC_TOKEN_SECRET_VERSION }}
      GCP_TYPESAFE_API_KEY_SECRET: ${{ vars.GCP_TYPESAFE_API_KEY_SECRET }}
      GCP_TYPESAFE_API_KEY_SECRET_VERSION: ${{ vars.GCP_TYPESAFE_API_KEY_SECRET_VERSION }}
      GCP_VOYAGE_API_KEY_SECRET: ${{ vars.GCP_VOYAGE_API_KEY_SECRET }}
      GCP_VOYAGE_API_KEY_SECRET_VERSION: ${{ vars.GCP_VOYAGE_API_KEY_SECRET_VERSION }}
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Validate protected staging configuration
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GCP_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "$INPUT_INTERPRETER" == 'rules' || "$INPUT_INTERPRETER" == 'jev-v1' || "$INPUT_INTERPRETER" == 'span-v2' ]]
          [[ "$GCP_REGION" =~ ^[a-z]+-[a-z]+[0-9]+$ ]]
          [[ "$GCP_CLOUD_RUN_SERVICE" =~ ^[a-z][a-z0-9-]{1,61}[a-z0-9]$ && "$GCP_CLOUD_RUN_SERVICE" == *staging* ]]
          [[ "$GCP_ARTIFACT_REGISTRY_REPOSITORY" =~ ^[a-z][a-z0-9._-]{1,61}[a-z0-9]$ ]]
          [[ "$GCP_COLLECTION_BUCKET" =~ ^[a-z0-9][a-z0-9._-]{1,61}[a-z0-9]$ && "$GCP_COLLECTION_BUCKET" == *staging* ]]
          [[ "$GCP_FIRESTORE_DATABASE" == '(default)' || "$GCP_FIRESTORE_DATABASE" =~ ^[a-z][a-z0-9-]{2,61}[a-z0-9]$ ]]
          [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[A-Za-z0-9_-]+/providers/[A-Za-z0-9_-]+$ ]]
          [[ "$GCP_DEPLOY_SERVICE_ACCOUNT" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z][a-z0-9-]{4,28}[a-z0-9]\.iam\.gserviceaccount\.com$ ]]
          [[ "$GCP_RUNTIME_SERVICE_ACCOUNT" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z][a-z0-9-]{4,28}[a-z0-9]\.iam\.gserviceaccount\.com$ ]]
          for name in GCP_SYNC_TOKEN_SECRET GCP_TYPESAFE_API_KEY_SECRET GCP_VOYAGE_API_KEY_SECRET; do [[ "${!name}" =~ ^[A-Za-z][A-Za-z0-9_-]{0,254}$ ]] || exit 1; done
          for name in GCP_SYNC_TOKEN_SECRET_VERSION GCP_TYPESAFE_API_KEY_SECRET_VERSION GCP_VOYAGE_API_KEY_SECRET_VERSION; do [[ "${!name}" =~ ^[1-9][0-9]*$ ]] || exit 1; done
      - name: Download reviewed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gcp-staging-image-${{ inputs.expected_sha }}
          path: candidate
      - name: Verify and load reviewed candidate
        run: |
          set -euo pipefail
          cd candidate
          sha256sum --check manifest.sha256
          sha256sum --check image.sha256
          node -e "const p=require('./provenance.json');if(p.revision!==process.env.EXPECTED_SHA||p.platform!=='linux/amd64')process.exit(1)"
          gunzip --stdout image.tar.gz | docker load
      - id: auth
        name: Authenticate deploy identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Refuse snapshot deployment over PostgreSQL runtime
        run: |
          set -euo pipefail
          STATE_DIR="$(mktemp -d)"
          trap 'rm -rf "$STATE_DIR"' EXIT
          gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --platform managed --format=json > "$STATE_DIR/service.json"
          mapfile -t LIVE_REVISIONS < <(node -e "const s=require(process.argv[1]);for(const t of s.status?.traffic??[])if(Number(t.percent??0)>0&&t.revisionName)console.log(t.revisionName)" "$STATE_DIR/service.json")
          test "${#LIVE_REVISIONS[@]}" -gt 0
          REVISION_FILES=()
          for revision in "${LIVE_REVISIONS[@]}"; do
            file="$STATE_DIR/$revision.json"
            gcloud run revisions describe "$revision" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --platform managed --format=json > "$file"
            REVISION_FILES+=("$file")
          done
          node web/scripts/guard-gcp-snapshot-deploy.mjs "$STATE_DIR/service.json" "${REVISION_FILES[@]}"
      - name: Push reviewed image and resolve digest
        id: image
        run: |
          set -euo pipefail
          LOCAL_IMAGE="biplan-gcp-candidate:$EXPECTED_SHA"
          REMOTE_TAG="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REGISTRY_REPOSITORY/$GCP_CLOUD_RUN_SERVICE:$EXPECTED_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker tag "$LOCAL_IMAGE" "$REMOTE_TAG"
          docker push "$REMOTE_TAG"
          IMAGE_REF="$(docker inspect --format='{{index .RepoDigests 0}}' "$REMOTE_TAG")"
          [[ "$IMAGE_REF" =~ @sha256:[0-9a-f]{64}$ ]]
          echo "ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
      - name: Deploy private staging revision
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          gcloud run deploy "$GCP_CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE_REF" --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --no-allow-unauthenticated --min-instances 0 --max-instances 1 --concurrency 32 --cpu 1 --cpu-throttling --no-cpu-boost --memory 2Gi --timeout 300 \
            --set-env-vars "BIPLAN_RUNTIME=node,BIPLAN_GCP_PROJECT=$GCP_PROJECT_ID,GCP_STORAGE_BUCKET=$GCP_COLLECTION_BUCKET,FIRESTORE_DATABASE=$GCP_FIRESTORE_DATABASE,DEPLOYMENT_ENV=staging,DEPLOYMENT_SHA=$EXPECTED_SHA,BIPLAN_CLIENT_IP_MODE=shared,BIPLAN_PREVIEW_TESTING=false,AI_DAILY_LIMIT=100,VOYAGE_DIMENSIONS=1024,INPUT_INTERPRETER=$INPUT_INTERPRETER" \
            --set-secrets "SYNC_TOKEN=$GCP_SYNC_TOKEN_SECRET:$GCP_SYNC_TOKEN_SECRET_VERSION,TYPESAFE_API_KEY=$GCP_TYPESAFE_API_KEY_SECRET:$GCP_TYPESAFE_API_KEY_SECRET_VERSION,VOYAGE_API_KEY=$GCP_VOYAGE_API_KEY_SECRET:$GCP_VOYAGE_API_KEY_SECRET_VERSION" --no-traffic --quiet
      - id: revision
        name: Resolve and verify deployed revision
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          STATE_DIR="$(mktemp -d)"
          trap 'rm -rf "$STATE_DIR"' EXIT
          gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --platform managed --format=json > "$STATE_DIR/service.json"
          CANDIDATE_REVISION="$(node -e "const s=require(process.argv[1]);const n=s.status?.latestCreatedRevisionName;if(typeof n!=='string'||!n.startsWith(process.env.GCP_CLOUD_RUN_SERVICE+'-')||!/^[a-z][a-z0-9-]{0,62}$/.test(n))process.exit(1);process.stdout.write(n)" "$STATE_DIR/service.json")"
          export CANDIDATE_REVISION
          gcloud run revisions describe "$CANDIDATE_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --platform managed --format=json > "$STATE_DIR/revision.json"
          node - "$STATE_DIR/revision.json" <<'NODE'
          const fs = require('node:fs');
          const revision = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const container = revision.spec?.containers?.[0];
          if (revision.metadata?.name !== process.env.CANDIDATE_REVISION || revision.status?.conditions?.find(condition => condition.type === 'Ready')?.status !== 'True') throw new Error('Deployed revision is not ready.');
          if (!container || container.image !== process.env.IMAGE_REF) throw new Error('Deployed revision image does not match the reviewed digest.');
          const values = Object.fromEntries((container.env ?? []).filter(item => typeof item?.name === 'string' && typeof item?.value === 'string').map(item => [item.name, item.value]));
          for (const [name, expected] of [['BIPLAN_RUNTIME','node'],['DEPLOYMENT_ENV','staging'],['DEPLOYMENT_SHA',process.env.EXPECTED_SHA],['INPUT_INTERPRETER',process.env.INPUT_INTERPRETER]]) {
            if (values[name] !== expected) throw new Error(`Deployed revision has invalid ${name}.`);
          }
          if ((values.CATALOG_BACKEND ?? 'snapshots') !== 'snapshots') throw new Error('Deployed revision is not snapshot-backed.');
          NODE
          node - "$STATE_DIR/service.json" > candidate-traffic-tags.json <<'NODE'
          const fs = require('node:fs');
          const service = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const tags = (service.spec?.traffic ?? []).filter(target => target.tag != null).map(target => ({ tag: target.tag, target: target.latestRevision === true ? 'LATEST' : target.revisionName })).sort((a,b) => a.tag.localeCompare(b.tag));
          for (const target of tags) {
            if (!/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(target.tag) || (target.target !== 'LATEST' && !/^[a-z][a-z0-9-]{0,62}$/.test(target.target ?? ''))) throw new Error('Invalid existing Cloud Run traffic tag.');
          }
          process.stdout.write(JSON.stringify(tags));
          NODE
          echo "name=$CANDIDATE_REVISION" >> "$GITHUB_OUTPUT"
      - name: Promote verified revision and preserve tags
        env:
          CANDIDATE_REVISION: ${{ steps.revision.outputs.name }}
        run: |
          set -euo pipefail
          mapfile -t TAG_ASSIGNMENTS < <(node -e "const tags=require('./candidate-traffic-tags.json');for(const target of tags)console.log(target.tag+'='+target.target)")
          TRAFFIC_ARGS=(run services update-traffic "$GCP_CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --platform managed --to-revisions "$CANDIDATE_REVISION=100")
          if test "${#TAG_ASSIGNMENTS[@]}" -gt 0; then
            TAG_CSV="$(IFS=,; echo "${TAG_ASSIGNMENTS[*]}")"
            TRAFFIC_ARGS+=(--update-tags "$TAG_CSV")
          fi
          gcloud "${TRAFFIC_ARGS[@]}" --quiet
          gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --platform managed --format=json > service-after-traffic.json
          node - service-after-traffic.json candidate-traffic-tags.json <<'NODE'
          const fs = require('node:fs');
          const service = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const beforeTags = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const traffic = service.status?.traffic ?? [];
          const live = traffic.filter(target => Number(target.percent ?? 0) > 0);
          if (live.reduce((sum,target) => sum + Number(target.percent), 0) !== 100 || live.some(target => target.revisionName !== process.env.CANDIDATE_REVISION)) throw new Error('Verified revision does not have 100 percent traffic.');
          const afterTags = (service.spec?.traffic ?? []).filter(target => target.tag != null).map(target => ({ tag: target.tag, target: target.latestRevision === true ? 'LATEST' : target.revisionName })).sort((a,b) => a.tag.localeCompare(b.tag));
          if (JSON.stringify(afterTags) !== JSON.stringify(beforeTags)) throw new Error('Cloud Run traffic tags changed during promotion.');
          NODE
      - id: service
        name: Resolve private service URL
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          [[ "$SERVICE_URL" =~ ^https://[a-z0-9-]+-[a-z0-9-]+\.[a-z0-9-]+\.run\.app$ ]]
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
      - id: health_auth
        name: Mint service-account identity token
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}
          id_token_include_email: true
      - name: Verify authenticated staging health
        env:
          SERVICE_URL: ${{ steps.service.outputs.url }}
          ID_TOKEN: ${{ steps.health_auth.outputs.id_token }}
        run: |
          set -euo pipefail
          HTTP_STATUS="$(curl --silent --show-error --max-time 30 --output health.json --write-out '%{http_code}' --header "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/api/health")"
          test "$HTTP_STATUS" = 200
          READY_HTTP_STATUS="$(curl --silent --show-error --max-time 30 --output ready.json --write-out '%{http_code}' --header "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/api/ready")"
          test "$READY_HTTP_STATUS" = 200
          HEALTH_ENVIRONMENT=staging HEALTH_REVISION="$EXPECTED_SHA" node - health.json ready.json <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const ready = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          if (health.status !== 'ok' || health.deployment?.environment !== process.env.HEALTH_ENVIRONMENT || health.deployment?.revision !== process.env.HEALTH_REVISION)
            throw new Error('Authenticated staging health response is invalid.');
          if (ready.ready !== true || !Array.isArray(ready.reasons) || ready.reasons.length !== 0)
            throw new Error('Authenticated staging readiness response is not ready.');
          if (typeof ready.checkedAt !== 'string' || !Number.isFinite(Date.parse(ready.checkedAt)))
            throw new Error('Authenticated staging readiness timestamp is invalid.');
          if (ready.catalog?.status !== 'ready' || !Number.isSafeInteger(ready.catalog.stored) || !Number.isSafeInteger(ready.catalog.eligible) || ready.catalog.eligible < 1)
            throw new Error('Authenticated staging readiness catalog is invalid.');
          if (!ready.checkpoint || typeof ready.checkpoint.savedAt !== 'string' || typeof ready.checkpoint.finishedAt !== 'string' || !Number.isSafeInteger(ready.checkpoint.events) || !Number.isSafeInteger(ready.checkpoint.bytes) || !ready.checkpoint.summary || typeof ready.checkpoint.summary !== 'object' || Array.isArray(ready.checkpoint.summary))
            throw new Error('Authenticated staging readiness checkpoint is invalid.');
          NODE
      - name: Record deployment provenance
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          CLOUD_RUN_REVISION: ${{ steps.revision.outputs.name }}
        run: |
          mkdir -p deploy-provenance
          cp health.json ready.json deploy-provenance/
          node -e "const fs=require('node:fs');fs.writeFileSync('deploy-provenance/gcp-staging.json',JSON.stringify({schemaVersion:1,environment:'staging',revision:process.env.EXPECTED_SHA,image:process.env.IMAGE_REF,cloudRunRevision:process.env.CLOUD_RUN_REVISION,service:process.env.GCP_CLOUD_RUN_SERVICE,region:process.env.GCP_REGION,inputInterpreter:process.env.INPUT_INTERPRETER,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT},null,2)+'\n')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gcp-staging-deployment-${{ inputs.expected_sha }}
          path: deploy-provenance
          if-no-files-found: error
          retention-days: 30
