name: Deploy GCP staging
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit SHA to prepare and deploy
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gcp-staging-deploy
  cancel-in-progress: false
jobs:
  prepare:
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Verify exact revision
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Require green core CI on exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100" > exact-sha-checks.json
          node scripts/deploy-gates.mjs checks exact-sha-checks.json
          node -e "const fs=require('node:fs');const runs=JSON.parse(fs.readFileSync('exact-sha-checks.json')).check_runs??[];for(const name of ['gcp','terraform']){const latest=runs.filter(x=>x.name===name&&x.app?.slug==='github-actions').sort((a,b)=>(Date.parse(b.started_at)||0)-(Date.parse(a.started_at)||0)||(BigInt(b.id??0)>BigInt(a.id??0)?1:BigInt(b.id??0)<BigInt(a.id??0)?-1:0))[0];if(latest?.status!=='completed'||latest?.conclusion!=='success')throw new Error('Missing latest successful exact-SHA check: '+name)}"
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            collector/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix ../collector
      - name: Run offline release checks
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm test --prefix ../collector
          npm run test:deploy-config
          npm run test:deploy:gcp
          node --experimental-strip-types scripts/check-release-cases.mjs
          node --experimental-strip-types scripts/evaluate-jev.ts
      - name: Build and smoke Node server
        run: |
          npm run build:node
          npm run test:smoke:node
      - name: Build immutable Linux image
        env:
          LOCAL_IMAGE: biplan-gcp-candidate:${{ inputs.expected_sha }}
        run: docker build --pull --platform linux/amd64 --tag "$LOCAL_IMAGE" .
      - name: Package image and provenance
        env:
          LOCAL_IMAGE: biplan-gcp-candidate:${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          rm -rf gcp-candidate
          mkdir gcp-candidate
          docker save "$LOCAL_IMAGE" | gzip -n > gcp-candidate/image.tar.gz
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          WEB_LOCK="$(sha256sum package-lock.json | cut -d' ' -f1)"
          COLLECTOR_LOCK="$(sha256sum ../collector/package-lock.json | cut -d' ' -f1)"
          IMAGE_ID="$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')"
          NPM_VERSION="$(npm --version)"
          SOURCE_TREE="$SOURCE_TREE" WEB_LOCK="$WEB_LOCK" COLLECTOR_LOCK="$COLLECTOR_LOCK" IMAGE_ID="$IMAGE_ID" NPM_VERSION="$NPM_VERSION" node -e "const fs=require('node:fs');const p={schemaVersion:1,revision:process.env.EXPECTED_SHA,sourceTree:process.env.SOURCE_TREE,imageId:process.env.IMAGE_ID,platform:'linux/amd64',node:process.version,npm:process.env.NPM_VERSION,lockfiles:{web:process.env.WEB_LOCK,collector:process.env.COLLECTOR_LOCK},workflowRunId:process.env.GITHUB_RUN_ID,workflowRunAttempt:process.env.GITHUB_RUN_ATTEMPT};fs.writeFileSync('gcp-candidate/provenance.json',JSON.stringify(p,null,2)+'\n')"
          (cd gcp-candidate && sha256sum image.tar.gz > image.sha256 && sha256sum image.sha256 provenance.json > manifest.sha256)
      - name: Upload immutable candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: gcp-staging-image-${{ inputs.expected_sha }}
          path: web/gcp-candidate
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Download candidate for round-trip verification
        uses: actions/download-artifact@v4
        with:
          name: gcp-staging-image-${{ inputs.expected_sha }}
          path: web/gcp-roundtrip
      - name: Verify stored candidate
        run: |
          set -euo pipefail
          cd gcp-roundtrip
          sha256sum --check manifest.sha256
          sha256sum --check image.sha256
          node -e "const p=require('./provenance.json');if(p.revision!==process.env.EXPECTED_SHA||p.platform!=='linux/amd64')process.exit(1)"
  deploy:
    needs: prepare
    if: needs.prepare.result == 'success'
    permissions:
      contents: read
      id-token: write
    environment: gcp-staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      GCP_ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      GCP_COLLECTION_BUCKET: ${{ vars.GCP_COLLECTION_BUCKET }}
      GCP_FIRESTORE_DATABASE: ${{ vars.GCP_FIRESTORE_DATABASE || '(default)' }}
      GCP_SYNC_TOKEN_SECRET: ${{ vars.GCP_SYNC_TOKEN_SECRET }}
      GCP_SYNC_TOKEN_SECRET_VERSION: ${{ vars.GCP_SYNC_TOKEN_SECRET_VERSION }}
      GCP_TYPESAFE_API_KEY_SECRET: ${{ vars.GCP_TYPESAFE_API_KEY_SECRET }}
      GCP_TYPESAFE_API_KEY_SECRET_VERSION: ${{ vars.GCP_TYPESAFE_API_KEY_SECRET_VERSION }}
      GCP_VOYAGE_API_KEY_SECRET: ${{ vars.GCP_VOYAGE_API_KEY_SECRET }}
      GCP_VOYAGE_API_KEY_SECRET_VERSION: ${{ vars.GCP_VOYAGE_API_KEY_SECRET_VERSION }}
    steps:
      - name: Validate protected staging configuration
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GCP_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "$GCP_REGION" =~ ^[a-z]+-[a-z]+[0-9]+$ ]]
          [[ "$GCP_CLOUD_RUN_SERVICE" =~ ^[a-z][a-z0-9-]{1,61}[a-z0-9]$ && "$GCP_CLOUD_RUN_SERVICE" == *staging* ]]
          [[ "$GCP_ARTIFACT_REGISTRY_REPOSITORY" =~ ^[a-z][a-z0-9._-]{1,61}[a-z0-9]$ ]]
          [[ "$GCP_COLLECTION_BUCKET" =~ ^[a-z0-9][a-z0-9._-]{1,61}[a-z0-9]$ && "$GCP_COLLECTION_BUCKET" == *staging* ]]
          [[ "$GCP_FIRESTORE_DATABASE" == '(default)' || "$GCP_FIRESTORE_DATABASE" =~ ^[a-z][a-z0-9-]{2,61}[a-z0-9]$ ]]
          [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[A-Za-z0-9_-]+/providers/[A-Za-z0-9_-]+$ ]]
          [[ "$GCP_DEPLOY_SERVICE_ACCOUNT" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z][a-z0-9-]{4,28}[a-z0-9]\.iam\.gserviceaccount\.com$ ]]
          [[ "$GCP_RUNTIME_SERVICE_ACCOUNT" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z][a-z0-9-]{4,28}[a-z0-9]\.iam\.gserviceaccount\.com$ ]]
          for name in GCP_SYNC_TOKEN_SECRET GCP_TYPESAFE_API_KEY_SECRET GCP_VOYAGE_API_KEY_SECRET; do [[ "${!name}" =~ ^[A-Za-z][A-Za-z0-9_-]{0,254}$ ]] || exit 1; done
          for name in GCP_SYNC_TOKEN_SECRET_VERSION GCP_TYPESAFE_API_KEY_SECRET_VERSION GCP_VOYAGE_API_KEY_SECRET_VERSION; do [[ "${!name}" =~ ^[1-9][0-9]*$ ]] || exit 1; done
      - name: Download reviewed candidate
        uses: actions/download-artifact@v4
        with:
          name: gcp-staging-image-${{ inputs.expected_sha }}
          path: candidate
      - name: Verify and load reviewed candidate
        run: |
          set -euo pipefail
          cd candidate
          sha256sum --check manifest.sha256
          sha256sum --check image.sha256
          node -e "const p=require('./provenance.json');if(p.revision!==process.env.EXPECTED_SHA||p.platform!=='linux/amd64')process.exit(1)"
          gunzip --stdout image.tar.gz | docker load
      - id: auth
        name: Authenticate deploy identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@v3
      - name: Push reviewed image and resolve digest
        id: image
        run: |
          set -euo pipefail
          LOCAL_IMAGE="biplan-gcp-candidate:$EXPECTED_SHA"
          REMOTE_TAG="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REGISTRY_REPOSITORY/$GCP_CLOUD_RUN_SERVICE:$EXPECTED_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker tag "$LOCAL_IMAGE" "$REMOTE_TAG"
          docker push "$REMOTE_TAG"
          IMAGE_REF="$(docker inspect --format='{{index .RepoDigests 0}}' "$REMOTE_TAG")"
          [[ "$IMAGE_REF" =~ @sha256:[0-9a-f]{64}$ ]]
          echo "ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
      - name: Deploy private staging revision
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          gcloud run deploy "$GCP_CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE_REF" --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --no-allow-unauthenticated --min-instances 0 --max-instances 1 --concurrency 32 --cpu 1 --cpu-throttling --no-cpu-boost --memory 1Gi --timeout 300 \
            --set-env-vars "BIPLAN_RUNTIME=node,BIPLAN_GCP_PROJECT=$GCP_PROJECT_ID,GCP_STORAGE_BUCKET=$GCP_COLLECTION_BUCKET,FIRESTORE_DATABASE=$GCP_FIRESTORE_DATABASE,DEPLOYMENT_ENV=staging,DEPLOYMENT_SHA=$EXPECTED_SHA,BIPLAN_CLIENT_IP_MODE=shared,AI_DAILY_LIMIT=100,VOYAGE_DIMENSIONS=1024" \
            --set-secrets "SYNC_TOKEN=$GCP_SYNC_TOKEN_SECRET:$GCP_SYNC_TOKEN_SECRET_VERSION,TYPESAFE_API_KEY=$GCP_TYPESAFE_API_KEY_SECRET:$GCP_TYPESAFE_API_KEY_SECRET_VERSION,VOYAGE_API_KEY=$GCP_VOYAGE_API_KEY_SECRET:$GCP_VOYAGE_API_KEY_SECRET_VERSION" --quiet
      - id: service
        name: Resolve private service URL
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          [[ "$SERVICE_URL" =~ ^https://[a-z0-9-]+-[a-z0-9-]+\.[a-z0-9-]+\.run\.app$ ]]
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
      - id: health_auth
        name: Mint service-account identity token
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}
          id_token_include_email: true
      - name: Verify authenticated staging health
        env:
          SERVICE_URL: ${{ steps.service.outputs.url }}
          ID_TOKEN: ${{ steps.health_auth.outputs.id_token }}
        run: |
          set -euo pipefail
          HTTP_STATUS="$(curl --silent --show-error --max-time 30 --output health.json --write-out '%{http_code}' --header "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/api/health")"
          test "$HTTP_STATUS" = 200
          HEALTH_ENVIRONMENT=staging HEALTH_REVISION="$EXPECTED_SHA" node -e "const fs=require('node:fs');const h=JSON.parse(fs.readFileSync('health.json','utf8'));if(h.status!=='ok'||h.deployment?.environment!==process.env.HEALTH_ENVIRONMENT||h.deployment?.revision!==process.env.HEALTH_REVISION)process.exit(1)"
      - name: Record deployment provenance
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          mkdir -p deploy-provenance
          node -e "const fs=require('node:fs');fs.writeFileSync('deploy-provenance/gcp-staging.json',JSON.stringify({schemaVersion:1,environment:'staging',revision:process.env.EXPECTED_SHA,image:process.env.IMAGE_REF,service:process.env.GCP_CLOUD_RUN_SERVICE,region:process.env.GCP_REGION,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT},null,2)+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: gcp-staging-deployment-${{ inputs.expected_sha }}
          path: deploy-provenance/gcp-staging.json
          if-no-files-found: error
          retention-days: 30
