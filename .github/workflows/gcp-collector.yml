name: Collect GCP staging event data

on:
  schedule:
    - cron: '17 */6 * * *'
    # Hourly: index new documents only (no collection).
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify the active staging publication without collecting or indexing
        required: true
        type: boolean
        default: false
      publish_existing_run:
        description: Failed collector run ID whose normalized artifact must be republished
        required: false
        type: string
        default: ''
      publish_existing_report_sha256:
        description: Exact SHA-256 of the preserved collector/output/report.json
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: gcp-event-collection-staging
  cancel-in-progress: false

jobs:
  dispatch_mode:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - id: mode
        name: Select one bounded workflow mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          PUBLISH_EXISTING_RUN: ${{ inputs.publish_existing_run }}
          PUBLISH_EXISTING_REPORT_SHA256: ${{ inputs.publish_existing_report_sha256 }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != 'workflow_dispatch' ]]; then
            echo 'mode=schedule' >> "$GITHUB_OUTPUT"
          elif [[ "$VERIFY_ONLY" == 'true' ]]; then
            test -z "$PUBLISH_EXISTING_RUN" && test -z "$PUBLISH_EXISTING_REPORT_SHA256"
            echo 'mode=verify' >> "$GITHUB_OUTPUT"
          elif [[ -n "$PUBLISH_EXISTING_RUN" || -n "$PUBLISH_EXISTING_REPORT_SHA256" ]]; then
            [[ "$PUBLISH_EXISTING_RUN" =~ ^[1-9][0-9]*$ ]]
            [[ "$PUBLISH_EXISTING_REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
            echo 'mode=replay' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=collect' >> "$GITHUB_OUTPUT"
          fi

  schedule_gate:
    needs: dispatch_mode
    if: needs.dispatch_mode.outputs.mode == 'collect' || (github.event.schedule == '17 */6 * * *' && vars.GCP_STAGING_COLLECTION_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - id: gate
        name: Enforce bounded scheduled-collection window
        env:
          EVENT_NAME: ${{ github.event_name }}
          COLLECTION_ENABLED: ${{ vars.GCP_STAGING_COLLECTION_ENABLED }}
          COLLECTION_UNTIL: ${{ vars.GCP_STAGING_COLLECTION_UNTIL }}
        run: |
          node collector/schedule-gate.mjs >> "$GITHUB_OUTPUT"
          # A skipped schedule leaves the run green; annotate it so a stale catalog is not a surprise.
          grep -qx 'run=true' "$GITHUB_OUTPUT" || echo "::warning title=Scheduled collection skipped::The collection window is closed or invalid (see GCP_STAGING_COLLECTION_UNTIL). This run did not refresh the staging catalog."

  collect:
    needs: schedule_gate
    if: needs.schedule_gate.outputs.run == 'true'
    environment: gcp-staging-collector
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      BIPLAN_URL: ${{ vars.BIPLAN_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - name: Validate private staging destination
        shell: bash
        env:
          COLLECTOR_SERVICE_ACCOUNT: ${{ vars.GCP_COLLECTOR_SERVICE_ACCOUNT }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_COLLECTOR_WORKLOAD_IDENTITY_PROVIDER }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          for name in BIPLAN_URL COLLECTOR_SERVICE_ACCOUNT WORKLOAD_IDENTITY_PROVIDER SYNC_TOKEN; do
            test -n "${!name}" || { echo "Missing required gcp-staging-collector setting: $name" >&2; exit 1; }
          done
          case "$BIPLAN_URL" in https://*.run.app) ;; *) echo "BIPLAN_URL must be a direct HTTPS Cloud Run URL." >&2; exit 1;; esac
          node -e "const u=new URL(process.env.BIPLAN_URL);if(u.origin!==process.env.BIPLAN_URL)throw new Error('BIPLAN_URL must be the exact Cloud Run origin without a path, query, or trailing slash.')"

      - id: auth_restore
        name: Authenticate collector for checkpoint restore
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_COLLECTOR_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_COLLECTOR_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.BIPLAN_URL }}
          id_token_include_email: true

      - run: npm ci --prefix collector
      - run: npm test --prefix collector

      - name: Restore durable checkpoint
        working-directory: collector
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SERVERLESS_ID_TOKEN: ${{ steps.auth_restore.outputs.id_token }}
        run: npm run checkpoint:restore -- --output state/events.json --fallback ../web/data/events.json

      - name: Restore durable coverage backlog
        id: coverage_restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: collector/state/coverage.json
          key: gcp-staging-collector-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gcp-staging-collector-coverage-

      - name: Collect public listings including later pages
        # Reserve time in the 90-minute job for durable publication and indexing.
        run: npm run collect --prefix collector -- --max-details 2000 --max-http 6000 --max-minutes 40 --discovery-pages 20 --raw-max-bytes 3221225472 --snapshot state/events.json

      - name: Save durable coverage backlog
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: collector/state/coverage.json
          key: gcp-staging-collector-coverage-${{ github.run_id }}-${{ github.run_attempt }}

      - id: auth_publish
        name: Refresh collector identity for publication
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_COLLECTOR_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_COLLECTOR_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.BIPLAN_URL }}
          id_token_include_email: true

      - id: publish
        name: Import, checkpoint, and read back canonical state
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SERVERLESS_ID_TOKEN: ${{ steps.auth_publish.outputs.id_token }}
        run: npm run publish --prefix collector -- --checkpoint --snapshot state/events.json --receipt output/publication.json

      - id: auth_index
        name: Refresh private HTTP identity for optional bounded indexing
        if: vars.GCP_STAGING_INDEXING_ENABLED == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_COLLECTOR_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_COLLECTOR_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.BIPLAN_URL }}
          id_token_include_email: true

      - id: index
        name: Index changed documents within the reviewed window
        timeout-minutes: 8
        env:
          GCP_STAGING_INDEXING_ENABLED: ${{ vars.GCP_STAGING_INDEXING_ENABLED }}
          GCP_STAGING_INDEXING_FROM: ${{ vars.GCP_STAGING_INDEXING_FROM }}
          GCP_STAGING_INDEXING_UNTIL: ${{ vars.GCP_STAGING_INDEXING_UNTIL }}
          GCP_STAGING_INDEXING_MAX_CALLS: ${{ vars.GCP_STAGING_INDEXING_MAX_CALLS }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SERVERLESS_ID_TOKEN: ${{ steps.auth_index.outputs.id_token }}
        run: |
          set -euo pipefail
          mkdir -p web/work
          set +e
          node --experimental-strip-types web/scripts/index-collected-embeddings.mjs --live --report web/work/collection-embedding-index.jsonl
          status=$?
          set -e
          case "$status" in
            0)
              echo "outcome=complete-or-disabled" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "outcome=bounded-stop" >> "$GITHUB_OUTPUT"
              echo "::warning title=Embedding indexing remains pending::Required collection and canonical publication succeeded, but optional bounded indexing stopped with pending documents. See the preserved indexing report."
              ;;
            *)
              echo "Indexing failed with exit code $status; required credentials, configuration, and evidence checks remain fatal." >&2
              exit "$status"
              ;;
          esac

      - name: Record published run evidence
        if: always() && steps.publish.outcome == 'success'
        working-directory: collector
        env:
          COLLECTION_ENVIRONMENT: staging
        run: npm run soak:report -- --publication output/publication.json

      - name: Save normalized data, source health, and run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gcp-event-data-staging-${{ github.run_id }}
          path: |
            collector/output/events.json
            collector/output/report.json
            collector/output/soak-evidence.json
            collector/output/publication.json
            collector/output/provider-listings.json
            collector/output/raw-fetches.json
            collector/output/pipeline-raw-collection.json
            collector/state/events.json
            collector/state/coverage.json
            web/work/collection-embedding-index.jsonl*
          if-no-files-found: warn
          retention-days: 14

  replay_publication:
    needs: dispatch_mode
    if: needs.dispatch_mode.outputs.mode == 'replay'
    environment: gcp-staging-collector
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      BIPLAN_URL: ${{ vars.BIPLAN_URL }}
      SOURCE_RUN_ID: ${{ inputs.publish_existing_run }}
      REPORT_SHA256: ${{ inputs.publish_existing_report_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize replay evidence
        if: always()
        run: |
          mkdir -p replay-evidence
          printf '{"schemaVersion":1,"completed":false,"problems":["replay_not_completed"]}\n' > replay-evidence/source.json
          cp replay-evidence/source.json replay-evidence/plan.json
          cp replay-evidence/source.json replay-evidence/preflight.json
          cp replay-evidence/source.json replay-evidence/publication.json
          printf 'not-started\n' > replay-evidence/publish-status.txt
          printf '{}\n' > replay-evidence/ready.json
          printf 'not-requested\n' > replay-evidence/ready-status.txt
          cp replay-evidence/source.json replay-evidence/validation.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - run: npm ci --prefix collector

      - id: source
        name: Validate source run and normalized artifact identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p replay-private
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail --silent --show-error "${headers[@]}" "$api/actions/runs/$SOURCE_RUN_ID" > replay-private/run.json
          curl --fail --silent --show-error "${headers[@]}" "$api/actions/workflows/gcp-collector.yml" > replay-private/workflow.json
          curl --fail --silent --show-error "${headers[@]}" "$api/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > replay-private/artifacts.json
          node --experimental-strip-types collector/replay-publication.mjs --mode metadata \
            --run-id "$SOURCE_RUN_ID" --repository "$REPOSITORY" --repository-id "$REPOSITORY_ID" \
            --default-branch "$DEFAULT_BRANCH" --workflow-path .github/workflows/gcp-collector.yml \
            --run replay-private/run.json --workflow replay-private/workflow.json --artifacts replay-private/artifacts.json \
            --output replay-evidence/source.json --github-output "$GITHUB_OUTPUT"
          git merge-base --is-ancestor "$(cat replay-evidence/source.json | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>process.stdout.write(JSON.parse(s).sourceHeadSha))")" "$GITHUB_SHA"

      - name: Download exact normalized collection artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: replay-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.publish_existing_run }}

      - id: artifact
        name: Verify artifact digest and preflight every import envelope
        run: |
          node --experimental-strip-types collector/replay-publication.mjs --mode artifact \
            --source replay-evidence/source.json --report replay-artifact/collector/output/report.json \
            --manifest replay-artifact/collector/output/pipeline-raw-collection.json \
            --report-sha256 "$REPORT_SHA256" --output replay-evidence/plan.json --github-output "$GITHUB_OUTPUT"

      - name: Validate private staging destination
        shell: bash
        env:
          COLLECTOR_SERVICE_ACCOUNT: ${{ vars.GCP_COLLECTOR_SERVICE_ACCOUNT }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_COLLECTOR_WORKLOAD_IDENTITY_PROVIDER }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          for name in BIPLAN_URL COLLECTOR_SERVICE_ACCOUNT WORKLOAD_IDENTITY_PROVIDER SYNC_TOKEN; do
            test -n "${!name}" || { echo "Missing required gcp-staging-collector setting: $name" >&2; exit 1; }
          done
          case "$BIPLAN_URL" in https://*.run.app) ;; *) echo "BIPLAN_URL must be a direct HTTPS Cloud Run URL." >&2; exit 1;; esac
          node -e "const u=new URL(process.env.BIPLAN_URL);if(u.origin!==process.env.BIPLAN_URL)throw new Error('BIPLAN_URL must be the exact Cloud Run origin without a path, query, or trailing slash.')"

      - id: auth_replay
        name: Authenticate collector for bounded publication replay
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_COLLECTOR_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_COLLECTOR_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.BIPLAN_URL }}
          id_token_include_email: true

      - id: preflight
        name: Refuse a wrong deployment or newer active checkpoint
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SERVERLESS_ID_TOKEN: ${{ steps.auth_replay.outputs.id_token }}
        run: |
          node --experimental-strip-types collector/replay-publication.mjs --mode preflight \
            --plan replay-evidence/plan.json --expected-revision "$GITHUB_SHA" \
            --output replay-evidence/preflight.json --github-output "$GITHUB_OUTPUT"

      - name: Publish the preserved report without collection or indexing
        if: steps.preflight.outputs.publish_required == 'true'
        timeout-minutes: 40
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SERVERLESS_ID_TOKEN: ${{ steps.auth_replay.outputs.id_token }}
        run: |
          set -euo pipefail
          printf 'running\n' > replay-evidence/publish-status.txt
          set +e
          node --experimental-strip-types collector/publish.mjs --checkpoint --validate-imports --exact-checkpoint \
            --report replay-artifact/collector/output/report.json --snapshot replay-evidence/recovered-events.json \
            --receipt replay-evidence/publication.json
          status=$?
          set -e
          if [[ "$status" == '0' ]]; then printf 'complete\n' > replay-evidence/publish-status.txt
          else printf 'failed\n' > replay-evidence/publish-status.txt; fi
          exit "$status"

      - name: Require exact canonical and ready publication evidence
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SERVERLESS_ID_TOKEN: ${{ steps.auth_replay.outputs.id_token }}
        run: |
          node --experimental-strip-types collector/replay-publication.mjs --mode verify \
            --plan replay-evidence/plan.json --preflight replay-evidence/preflight.json \
            --publication replay-evidence/publication.json --source replay-evidence/ready.json \
            --status replay-evidence/ready-status.txt --output replay-evidence/validation.json

      - name: Preserve bounded publication replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gcp-publication-replay-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            replay-evidence/source.json
            replay-evidence/plan.json
            replay-evidence/preflight.json
            replay-evidence/publication.json
            replay-evidence/publish-status.txt
            replay-evidence/ready.json
            replay-evidence/ready-status.txt
            replay-evidence/validation.json
          if-no-files-found: error
          retention-days: 14

  index_only:
    # Hourly vector refresh between collections. The per-run and daily call
    # caps in web/lib/audited-index.ts still apply.
    needs: dispatch_mode
    if: github.event.schedule == '47 * * * *' && vars.GCP_STAGING_INDEXING_ENABLED == 'true'
    environment: gcp-staging-collector
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      BIPLAN_URL: ${{ vars.BIPLAN_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc

      - id: auth_index
        name: Authenticate for private indexing
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_COLLECTOR_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_COLLECTOR_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.BIPLAN_URL }}
          id_token_include_email: true

      - name: Index changed documents
        timeout-minutes: 8
        env:
          GCP_STAGING_INDEXING_ENABLED: ${{ vars.GCP_STAGING_INDEXING_ENABLED }}
          GCP_STAGING_INDEXING_FROM: ${{ vars.GCP_STAGING_INDEXING_FROM }}
          GCP_STAGING_INDEXING_UNTIL: ${{ vars.GCP_STAGING_INDEXING_UNTIL }}
          GCP_STAGING_INDEXING_MAX_CALLS: ${{ vars.GCP_STAGING_INDEXING_MAX_CALLS }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SERVERLESS_ID_TOKEN: ${{ steps.auth_index.outputs.id_token }}
        run: |
          set -euo pipefail
          mkdir -p web/work
          set +e
          node --experimental-strip-types web/scripts/index-collected-embeddings.mjs --live --report web/work/collection-embedding-index.jsonl
          status=$?
          set -e
          case "$status" in
            0) ;;
            2) echo "::notice title=Indexing continues next hour::The run reached its bounded call limit with documents still pending." ;;
            *) exit "$status" ;;
          esac

      - name: Save indexing report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gcp-index-staging-${{ github.run_id }}
          path: web/work/collection-embedding-index.jsonl*
          if-no-files-found: warn
          retention-days: 7

  monitor:
    # Hourly health check. A failed scheduled run makes GitHub send a failure
    # email. It lives here because the collector identity trusts only this file.
    needs: dispatch_mode
    if: github.event.schedule == '47 * * * *' || needs.dispatch_mode.outputs.mode == 'verify'
    environment: gcp-staging-collector
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Initialize readiness evidence
        if: always()
        run: |
          mkdir -p monitor-evidence
          printf '{}\n' > monitor-evidence/ready.json
          printf 'not-requested\n' > monitor-evidence/status.txt
          printf '{"schemaVersion":1,"completed":false,"problems":["monitor_not_completed"]}\n' > monitor-evidence/validation.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc

      - id: auth_monitor
        name: Authenticate for the private readiness check
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_COLLECTOR_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_COLLECTOR_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.BIPLAN_URL }}

      - name: Require a ready and fresh staging catalog
        env:
          BIPLAN_URL: ${{ vars.BIPLAN_URL }}
          ID_TOKEN: ${{ steps.auth_monitor.outputs.id_token }}
          MAX_AGE_HOURS: '14'
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 60 -o monitor-evidence/ready.json -w '%{http_code}' \
            -H "Authorization: Bearer $ID_TOKEN" "$BIPLAN_URL/api/ready" > monitor-evidence/status.txt || true
          node - monitor-evidence/status.txt monitor-evidence/ready.json monitor-evidence/validation.json <<'NODE'
          const fs = require('node:fs');
          const status = fs.readFileSync(process.argv[2], 'utf8').trim();
          let body = {};
          let validJson = true;
          try {
            const parsed = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
            if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) validJson = false;
            else body = parsed;
          }
          catch { validJson = false; }
          const canonicalTimestamp = value => typeof value === 'string' && Number.isFinite(Date.parse(value)) && new Date(Date.parse(value)).toISOString() === value ? value : null;
          const lastCheckedAt = canonicalTimestamp(body.catalog?.lastCheckedAt);
          const checked = Date.parse(lastCheckedAt ?? '');
          const ageHours = (Date.now() - checked) / 3600000;
          const pending = typeof body.search?.pending === 'boolean' ? body.search.pending : null;
          const latestCollectedAt = canonicalTimestamp(body.search?.latestCollectedAt);
          const activeCollectedAt = canonicalTimestamp(body.search?.activeCollectedAt);
          const checkpointFinishedAt = canonicalTimestamp(body.checkpoint?.finishedAt);
          const reasonShapeValid = Array.isArray(body.reasons) && body.reasons.every(reason => typeof reason === 'string');
          const reasons = reasonShapeValid
            ? body.reasons.map(reason => /^[a-z0-9_]{1,64}$/.test(reason) ? reason : 'invalid_reason').slice(0, 20)
            : null;
          const problems = [];
          if (status !== '200') problems.push('http_status');
          if (!validJson) problems.push('invalid_json');
          if (body.ready !== true) problems.push('not_ready');
          if (!reasonShapeValid || body.reasons.length !== 0) problems.push('readiness_reasons');
          if (!Number.isFinite(ageHours) || ageHours > Number(process.env.MAX_AGE_HOURS)) problems.push('catalog_freshness');
          if (pending === true) problems.push('publication_pending');
          if (pending === null || !latestCollectedAt || !activeCollectedAt || !checkpointFinishedAt)
            problems.push('publication_proof_missing');
          else if (latestCollectedAt !== activeCollectedAt || activeCollectedAt !== checkpointFinishedAt)
            problems.push('publication_mismatch');
          const summary = {
            schemaVersion: 1,
            completed: true,
            validatedAt: new Date().toISOString(),
            httpStatus: /^\d{3}$/.test(status) ? status : null,
            validJson,
            ready: typeof body.ready === 'boolean' ? body.ready : null,
            reasons,
            eligible: Number.isSafeInteger(body.catalog?.eligible) ? body.catalog.eligible : null,
            lastCheckedAt,
            ageHours: Number.isFinite(ageHours) ? Number(ageHours.toFixed(3)) : null,
            publication: { pending, latestCollectedAt, activeCollectedAt, checkpointFinishedAt },
            problems,
          };
          fs.writeFileSync(process.argv[4], `${JSON.stringify(summary, null, 2)}\n`);
          console.log(JSON.stringify(summary));
          if (problems.length) {
            console.log(`::error title=Staging unhealthy::${problems.join(',')}`);
            process.exit(1);
          }
          NODE

      - name: Preserve readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gcp-ready-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            monitor-evidence/ready.json
            monitor-evidence/status.txt
            monitor-evidence/validation.json
          if-no-files-found: error
          retention-days: 14
