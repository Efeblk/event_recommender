name: Collect GCP staging event data

on:
  schedule:
    - cron: '17 */6 * * *'
    # Hourly: index new documents only (no collection).
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcp-event-collection-staging
  cancel-in-progress: false

jobs:
  schedule_gate:
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '17 */6 * * *' && vars.GCP_STAGING_COLLECTION_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - id: gate
        name: Enforce bounded scheduled-collection window
        env:
          EVENT_NAME: ${{ github.event_name }}
          COLLECTION_ENABLED: ${{ vars.GCP_STAGING_COLLECTION_ENABLED }}
          COLLECTION_UNTIL: ${{ vars.GCP_STAGING_COLLECTION_UNTIL }}
        run: |
          node collector/schedule-gate.mjs >> "$GITHUB_OUTPUT"
          # A skipped schedule leaves the run green; annotate it so a stale catalog is not a surprise.
          grep -qx 'run=true' "$GITHUB_OUTPUT" || echo "::warning title=Scheduled collection skipped::The collection window is closed or invalid (see GCP_STAGING_COLLECTION_UNTIL). This run did not refresh the staging catalog."

  collect:
    needs: schedule_gate
    if: needs.schedule_gate.outputs.run == 'true'
    environment: gcp-staging-collector
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      BIPLAN_URL: ${{ vars.BIPLAN_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - name: Validate private staging destination
        shell: bash
        env:
          COLLECTOR_SERVICE_ACCOUNT: ${{ vars.GCP_COLLECTOR_SERVICE_ACCOUNT }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_COLLECTOR_WORKLOAD_IDENTITY_PROVIDER }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          for name in BIPLAN_URL COLLECTOR_SERVICE_ACCOUNT WORKLOAD_IDENTITY_PROVIDER SYNC_TOKEN; do
            test -n "${!name}" || { echo "Missing required gcp-staging-collector setting: $name" >&2; exit 1; }
          done
          case "$BIPLAN_URL" in https://*.run.app) ;; *) echo "BIPLAN_URL must be a direct HTTPS Cloud Run URL." >&2; exit 1;; esac
          node -e "const u=new URL(process.env.BIPLAN_URL);if(u.origin!==process.env.BIPLAN_URL)throw new Error('BIPLAN_URL must be the exact Cloud Run origin without a path, query, or trailing slash.')"

      - id: auth_restore
        name: Authenticate collector for checkpoint restore
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_COLLECTOR_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_COLLECTOR_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.BIPLAN_URL }}
          id_token_include_email: true

      - run: npm ci --prefix collector
      - run: npm test --prefix collector

      - name: Restore durable checkpoint
        working-directory: collector
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SERVERLESS_ID_TOKEN: ${{ steps.auth_restore.outputs.id_token }}
        run: npm run checkpoint:restore -- --output state/events.json --fallback ../web/data/events.json

      - name: Restore durable coverage backlog
        id: coverage_restore
        uses: actions/cache/restore@v4
        with:
          path: collector/state/coverage.json
          key: gcp-staging-collector-coverage-${{ github.run_id }}
          restore-keys: gcp-staging-collector-coverage-

      - name: Collect public listings including later pages
        # Reserve time in the 60-minute job for durable publication and indexing.
        run: npm run collect --prefix collector -- --max-details 2000 --max-http 6000 --max-minutes 40 --discovery-pages 20 --raw-max-bytes 3221225472 --snapshot state/events.json

      - name: Save durable coverage backlog
        if: always()
        uses: actions/cache/save@v4
        with:
          path: collector/state/coverage.json
          key: gcp-staging-collector-coverage-${{ github.run_id }}

      - id: auth_publish
        name: Refresh collector identity for publication
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_COLLECTOR_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_COLLECTOR_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.BIPLAN_URL }}
          id_token_include_email: true

      - id: publish
        name: Import, checkpoint, and read back canonical state
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SERVERLESS_ID_TOKEN: ${{ steps.auth_publish.outputs.id_token }}
        run: npm run publish --prefix collector -- --checkpoint --snapshot state/events.json --receipt output/publication.json

      - id: auth_index
        name: Refresh private HTTP identity for optional bounded indexing
        if: vars.GCP_STAGING_INDEXING_ENABLED == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_COLLECTOR_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_COLLECTOR_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.BIPLAN_URL }}
          id_token_include_email: true

      - id: index
        name: Index changed documents within the reviewed window
        timeout-minutes: 8
        env:
          GCP_STAGING_INDEXING_ENABLED: ${{ vars.GCP_STAGING_INDEXING_ENABLED }}
          GCP_STAGING_INDEXING_FROM: ${{ vars.GCP_STAGING_INDEXING_FROM }}
          GCP_STAGING_INDEXING_UNTIL: ${{ vars.GCP_STAGING_INDEXING_UNTIL }}
          GCP_STAGING_INDEXING_MAX_CALLS: ${{ vars.GCP_STAGING_INDEXING_MAX_CALLS }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SERVERLESS_ID_TOKEN: ${{ steps.auth_index.outputs.id_token }}
        run: |
          set -euo pipefail
          mkdir -p web/work
          set +e
          node --experimental-strip-types web/scripts/index-collected-embeddings.mjs --live --report web/work/collection-embedding-index.jsonl
          status=$?
          set -e
          case "$status" in
            0)
              echo "outcome=complete-or-disabled" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "outcome=bounded-stop" >> "$GITHUB_OUTPUT"
              echo "::warning title=Embedding indexing remains pending::Required collection and canonical publication succeeded, but optional bounded indexing stopped with pending documents. See the preserved indexing report."
              ;;
            *)
              echo "Indexing failed with exit code $status; required credentials, configuration, and evidence checks remain fatal." >&2
              exit "$status"
              ;;
          esac

      - name: Record published run evidence
        if: always() && steps.publish.outcome == 'success'
        working-directory: collector
        env:
          COLLECTION_ENVIRONMENT: staging
        run: npm run soak:report -- --publication output/publication.json

      - name: Save normalized data, source health, and run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-event-data-staging-${{ github.run_id }}
          path: |
            collector/output/events.json
            collector/output/report.json
            collector/output/soak-evidence.json
            collector/output/publication.json
            collector/output/provider-listings.json
            collector/output/raw-fetches.json
            collector/output/pipeline-raw-collection.json
            collector/state/events.json
            collector/state/coverage.json
            web/work/collection-embedding-index.jsonl*
          if-no-files-found: warn
          retention-days: 14

  index_only:
    # Hourly vector refresh between collections. The per-run and daily call
    # caps in web/lib/audited-index.ts still apply.
    if: github.event.schedule == '47 * * * *' && vars.GCP_STAGING_INDEXING_ENABLED == 'true'
    environment: gcp-staging-collector
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      BIPLAN_URL: ${{ vars.BIPLAN_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc

      - id: auth_index
        name: Authenticate for private indexing
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_COLLECTOR_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_COLLECTOR_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.BIPLAN_URL }}
          id_token_include_email: true

      - name: Index changed documents
        timeout-minutes: 8
        env:
          GCP_STAGING_INDEXING_ENABLED: ${{ vars.GCP_STAGING_INDEXING_ENABLED }}
          GCP_STAGING_INDEXING_FROM: ${{ vars.GCP_STAGING_INDEXING_FROM }}
          GCP_STAGING_INDEXING_UNTIL: ${{ vars.GCP_STAGING_INDEXING_UNTIL }}
          GCP_STAGING_INDEXING_MAX_CALLS: ${{ vars.GCP_STAGING_INDEXING_MAX_CALLS }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SERVERLESS_ID_TOKEN: ${{ steps.auth_index.outputs.id_token }}
        run: |
          set -euo pipefail
          mkdir -p web/work
          set +e
          node --experimental-strip-types web/scripts/index-collected-embeddings.mjs --live --report web/work/collection-embedding-index.jsonl
          status=$?
          set -e
          case "$status" in
            0) ;;
            2) echo "::notice title=Indexing continues next hour::The run reached its bounded call limit with documents still pending." ;;
            *) exit "$status" ;;
          esac

      - name: Save indexing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-index-staging-${{ github.run_id }}
          path: web/work/collection-embedding-index.jsonl*
          if-no-files-found: warn
          retention-days: 7
